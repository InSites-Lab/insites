 "significance": {
  "statement": "The Ayelet Hashachar water tower is significant first as the founding infrastructure of the permanent settlement. It was built in 1923 together with the cowshed and the first five houses, and it gave the settlement its first piped, pressurised water. For eight years the settlers had carried water in tins and barrels and contested a weak spring. The tower fed taps at the houses and the farmyard by gravity, and it stood as the landmark at the centre of the horseshoe. The report on its 2018 reopening calls it a symbol of the beginning of settlement. Its supply was on the scale of households and the farmyard; the fields had to wait for the wells of 1936–40 and for Mekorot in the 1950s. The members later built a similar tower at Yesod HaMa'ala.\n\nLater layers deepened this founding role. Read together, ICA's 1922 drawing and the plaque that names only the labour builders record the 1920s contest over what form the settlement should take. In 1936–39 a shelter on the tank made the tower a relay in the Haganah's Upper Galilee signal network, a decade before the Negev towers became symbols of 1948. In 2018 the members restored it and reopened it with song and a member's retelling of its history. Every layer can be dated from a drawing or a photograph, from ICA's 1922 sheet to Soskin's 1923 completion photo.\n\nThe tank and its frame still show the tower's water role, but it no longer works, and the water system around it was last recorded in 2012. The restoration kept the security shelter, marked the gables in paint and left the plaque untreated. Open: whether ICA decorated its other towers, such as Kfar Giladi's; what the painted gables convey; how much original concrete the repairs kept; and whether the plaque will survive until the 2027 listing."

      "body": "**Asset:** Ayelet Hashachar Water Tower, a reinforced-concrete water tower on the hilltop at the centre of the kibbutz's horseshoe layout, southern Hula Valley. Designed by ICA's Bureau Technique in June 1922 and built in 1923 by the Ahva group of the Labour Battalion under technician Michael Ehrlich, together with the first cowshed and five houses. A tank of about 25 m³ on four columns, with framed panels, gables and corner blocks, and a plaque naming its builders.\n\n**Sources:** a Tier 3 documentation report (Alef 2012, appendix 2016), a Tier 2 article (Amit-Cohen & Alef 2017), Soskin's 1923 photograph, a 2018 news report (Walla), a 2018 photograph and the assessor's additions. The CZA holds no further data on the tower."
